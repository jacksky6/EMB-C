# Generated by the TCA9548A add-on installer for EMB-C.
# Software: AFC; MCU: EMU_1; lanes: 4; sensor: AHT20
# Complete the matching MCU configuration before restarting Klipper.
# For multiple units or custom names, edit this file to match your setup.

[tca9548a mux1]
i2c_mcu: EMU_1
i2c_bus: i2c1_PB6_PB7   # STM32G0B1
i2c_address: 112 # 0x70, A0/A1/A2 all low; use 113-119 for 0x71-0x77
environment_report_time: 120
reset_pin: EMU_1:PC12
reset_active_high: True

# On a failed supported environment sensor transfer, set either displayed value
# to zero instead of retaining its previous valid value.
# Set these only in this mux section.
zero_temperature_on_error: True
zero_humidity_on_error: True

# Skip environment samples during AFC or Happy Hare tool changes in a print.
pause_env_on_toolchange: True

# lane1 -> TCA9548A channel 0
[temperature_sensor lane1]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 0
i2c_address: 56
min_temp: -20
max_temp: 80

# lane2 -> TCA9548A channel 1
[temperature_sensor lane2]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 1
i2c_address: 56
min_temp: -20
max_temp: 80

# lane3 -> TCA9548A channel 2
[temperature_sensor lane3]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 2
i2c_address: 56
min_temp: -20
max_temp: 80

# lane4 -> TCA9548A channel 3
[temperature_sensor lane4]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 3
i2c_address: 56
min_temp: -20
max_temp: 80
